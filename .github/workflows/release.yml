name: Release

on:
  push:
    tags:
      - 'v*'
      - 'Snapshot-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 这份矩阵必须与 install-komari-slim.sh 的 detect_arch() 对齐：
        # 该函数接受 amd64 / arm64 / 386 / riscv64 / loong64 五种 Linux 架构，
        # 拼出的 URL 是 komari-linux-<arch>。若矩阵少构建某个架构，
        # 对应机器上跑安装脚本就会 404（且报错信息是"下载失败"，会误导成网络问题）。
        # 覆盖范围与上游 komari 的 Release 一致（上游同样发布这 8 个资产）。
        include:
          # ---- Linux ----
          - goos: linux
            goarch: amd64
            target: x86_64-linux-musl
            binary: komari-linux-amd64
            ext: ''
          - goos: linux
            goarch: arm64
            target: aarch64-linux-musl
            binary: komari-linux-arm64
            ext: ''
          - goos: linux
            goarch: '386'
            target: x86-linux-musl
            binary: komari-linux-386
            ext: ''
          - goos: linux
            goarch: riscv64
            target: riscv64-linux-musl
            binary: komari-linux-riscv64
            ext: ''
          - goos: linux
            goarch: loong64
            target: loongarch64-linux-musl
            binary: komari-linux-loong64
            ext: ''
          # ---- Windows ----
          - goos: windows
            goarch: amd64
            target: x86_64-windows-gnu
            binary: komari-windows-amd64
            ext: '.exe'
          - goos: windows
            goarch: arm64
            target: aarch64-windows-gnu
            binary: komari-windows-arm64
            ext: '.exe'
          - goos: windows
            goarch: '386'
            target: x86-windows-gnu
            binary: komari-windows-386
            ext: '.exe'
    steps:
      - name: Checkout server
        uses: actions/checkout@v7
        with:
          path: server

      - name: Checkout web
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/komari-slim-web
          path: web

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          # 必须显式指定依赖文件位置：server 被检出到 server/ 子目录，
          # 而 setup-go 默认在**仓库根目录**找 go.sum，找不到就报
          # "Dependencies file is not found ... Supported file pattern: go.sum"
          # 并让缓存失效（CI 日志里会看到 Cache service responded with 400）。
          cache: true
          cache-dependency-path: server/go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 手工安装 zig，不用 action。
      # 原因：goto-bus-stop/setup-zig@v2（作者已标记为 legacy，其 action.yml
      # 里写着 "Please use mlugg/setup-zig instead"）和 mlugg/setup-zig
      # **目前都仍是 runs.using: node20**，会持续触发 Node 20 弃用告警。
      # 手工下载没有这个依赖，也不会再有该告警。
      # 代价：每个 job 各自下载约 47MB，且失去 action 自带的编译器缓存；
      # 8 个 job 并行，墙钟时间增加约 10-20 秒。发布频率不高，可以接受。
      - name: Install Zig 0.14.0
        run: |
          set -euo pipefail
          ZIG_VER=0.14.0
          # 注意 0.14.0 用的是旧命名 zig-linux-x86_64-<ver>.tar.xz，
          # 新的 zig-<arch>-linux-<ver>.tar.xz 对 0.14.0 会 404（已实测）。
          curl -fsSL -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VER}/zig-linux-x86_64-${ZIG_VER}.tar.xz"
          mkdir -p "$HOME/zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
          "$HOME/zig/zig" version

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Build frontend
        working-directory: ./web
        run: |
          npm ci
          npm run build
          mkdir -p "${{ github.workspace }}/server/web/public/defaultTheme"
          tar -cf "${{ github.workspace }}/server/web/public/defaultTheme/dist.tar" -C dist .
          zstd -19 -T0 -q -f "${{ github.workspace }}/server/web/public/defaultTheme/dist.tar" -o "${{ github.workspace }}/server/web/public/defaultTheme/dist.tar.zst"
          rm -f "${{ github.workspace }}/server/web/public/defaultTheme/dist.tar"
          cp -f komari-theme.json "${{ github.workspace }}/server/web/public/defaultTheme/komari-theme.json"
          if [ -f preview.webp ]; then cp -f preview.webp "${{ github.workspace }}/server/web/public/defaultTheme/preview.webp"; fi

      - name: Build binary
        working-directory: ./server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: zig cc -target ${{ matrix.target }}
        run: |
          H="${GITHUB_SHA::7}"
          VERSION="${GITHUB_REF_NAME}"
          go build -trimpath -ldflags="-s -w -X github.com/komari-monitor/komari/utils.CurrentVersion=${VERSION} -X github.com/komari-monitor/komari/utils.VersionHash=${H}" -o "build/${{ matrix.binary }}${{ matrix.ext }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}${{ matrix.ext }}
          path: server/build/${{ matrix.binary }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        # 停在 v7 而不是最新的 v8：v8 改了下载行为
        # （"will no longer attempt to unzip all downloaded files"，
        #  且有 "Enforced checks (breaking)"），会破坏下面
        # "下载多个 artifact 后 find + cp 拍平" 的逻辑。
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
